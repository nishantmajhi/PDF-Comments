name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tests/*.test.js"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The runner exits 0 with "SKIP" when it finds no browser, which would
      # read as a pass here, so a skip fails the job.
      - name: Browser suite
        run: |
          node tests/browser/run.js | tee browser.log
          ! grep -q '^SKIP' browser.log
